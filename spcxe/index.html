<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrapped SPCXB - Space Portal</title>
    <link rel="icon" type="image/png" href="https://bscscan.com/token/images/bstocks_spacexb_64.png">
    <link rel="apple-touch-icon" href="https://bscscan.com/token/images/bstocks_spacexb_64.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Rajdhani', sans-serif;
            background: #000;
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Starfield background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090a0f 100%);
            overflow: hidden;
            z-index: 0;
        }

        .stars::before,
        .stars::after {
            content: '';
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(1px 1px at 160px 120px, #fff, transparent);
            background-size: 200px 200px;
            animation: moveStars 100s linear infinite;
        }

        .stars::after {
            background-image: 
                radial-gradient(1px 1px at 50px 160px, rgba(255,255,255,0.9), transparent),
                radial-gradient(2px 2px at 100px 50px, #fff, transparent),
                radial-gradient(1px 1px at 150px 100px, rgba(255,255,255,0.7), transparent);
            background-size: 250px 250px;
            animation: moveStars 150s linear infinite;
        }

        @keyframes moveStars {
            from { transform: translate(0, 0); }
            to { transform: translate(-50%, -50%); }
        }

        /* Nebula glow */
        .nebula {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(80, 200, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(255, 100, 200, 0.08) 0%, transparent 60%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 20px;
            box-shadow: 0 0 40px rgba(120, 80, 255, 0.6);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.5em;
            font-weight: 900;
            background: linear-gradient(135deg, #7850ff, #50c8ff, #ff64c8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(120, 80, 255, 0.5);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.1em;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Language Toggle */
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: rgba(120, 80, 255, 0.2);
            border: 1px solid rgba(120, 80, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .lang-toggle:hover {
            background: rgba(120, 80, 255, 0.4);
            box-shadow: 0 0 20px rgba(120, 80, 255, 0.6);
        }

        /* Connect Wallet */
        .connect-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, rgba(120, 80, 255, 0.3), rgba(80, 200, 255, 0.3));
            border: 2px solid rgba(120, 80, 255, 0.5);
            border-radius: 12px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            letter-spacing: 1px;
        }

        .connect-btn:hover {
            background: linear-gradient(135deg, rgba(120, 80, 255, 0.5), rgba(80, 200, 255, 0.5));
            box-shadow: 0 0 30px rgba(120, 80, 255, 0.8);
            transform: translateY(-2px);
        }

        .connect-btn.connected {
            background: rgba(80, 200, 120, 0.2);
            border-color: rgba(80, 200, 120, 0.6);
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.9em;
        }

        /* Card */
        .card {
            background: rgba(20, 20, 40, 0.6);
            border: 1px solid rgba(120, 80, 255, 0.3);
            border-radius: 20px;
            padding: 30px;
            backdrop-filter: blur(20px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
        }

        /* Balance Display */
        .balance-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .balance-label {
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .balance-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 2em;
            font-weight: 700;
            background: linear-gradient(135deg, #7850ff, #50c8ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(120, 80, 255, 0.4);
        }

        /* Input Group */
        .input-group {
            margin-bottom: 20px;
        }

        .input-label {
            display: block;
            font-size: 0.9em;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            gap: 10px;
        }

        input[type="number"] {
            flex: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(120, 80, 255, 0.3);
            border-radius: 10px;
            padding: 15px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1em;
            outline: none;
            transition: all 0.3s;
        }

        /* Remove number input arrows */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        input[type="number"]:focus {
            border-color: rgba(120, 80, 255, 0.8);
            box-shadow: 0 0 20px rgba(120, 80, 255, 0.3);
        }

        .max-btn {
            background: rgba(120, 80, 255, 0.3);
            border: 1px solid rgba(120, 80, 255, 0.5);
            border-radius: 10px;
            padding: 0 20px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .max-btn:hover {
            background: rgba(120, 80, 255, 0.5);
        }

        /* Action Buttons */
        .btn-group {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-family: 'Orbitron', sans-serif;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .deposit-btn {
            background: linear-gradient(135deg, #7850ff, #50c8ff);
            color: #fff;
        }

        .deposit-btn:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(120, 80, 255, 0.8);
            transform: translateY(-2px);
        }

        .withdraw-btn {
            background: linear-gradient(135deg, #ff64c8, #7850ff);
            color: #fff;
        }

        .withdraw-btn:hover:not(:disabled) {
            box-shadow: 0 0 30px rgba(255, 100, 200, 0.8);
            transform: translateY(-2px);
        }

        .action-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(120, 80, 255, 0.3);
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.5);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tab-btn.active {
            background: rgba(120, 80, 255, 0.3);
            border-color: rgba(120, 80, 255, 0.6);
            color: #fff;
            box-shadow: 0 0 15px rgba(120, 80, 255, 0.4);
        }

        .tab-btn:hover:not(.active) {
            background: rgba(120, 80, 255, 0.15);
            color: rgba(255, 255, 255, 0.7);
        }

        /* Info Section */
        .info-card {
            background: rgba(20, 20, 40, 0.4);
            border: 1px solid rgba(120, 80, 255, 0.2);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.9em;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: rgba(255, 255, 255, 0.5);
        }

        .info-value {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        .info-value a {
            color: #50c8ff;
            text-decoration: none;
            transition: all 0.3s;
        }

        .info-value a:hover {
            color: #7850ff;
            text-shadow: 0 0 10px rgba(120, 80, 255, 0.6);
        }

        /* Status Message */
        .status {
            text-align: center;
            padding: 15px;
            margin-top: 20px;
            border-radius: 10px;
            font-size: 0.9em;
            display: none;
        }

        .status.show {
            display: block;
            animation: fadeIn 0.3s;
        }

        .status.success {
            background: rgba(80, 200, 120, 0.2);
            border: 1px solid rgba(80, 200, 120, 0.4);
            color: #50c878;
        }

        .status.error {
            background: rgba(255, 80, 80, 0.2);
            border: 1px solid rgba(255, 80, 80, 0.4);
            color: #ff5050;
        }

        .status.info {
            background: rgba(80, 200, 255, 0.2);
            border: 1px solid rgba(80, 200, 255, 0.4);
            color: #50c8ff;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85em;
        }

        .owner-badge {
            display: inline-block;
            background: rgba(120, 80, 255, 0.2);
            border: 1px solid rgba(120, 80, 255, 0.4);
            padding: 8px 16px;
            border-radius: 20px;
            margin-top: 10px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
            }
            h1 {
                font-size: 1.8em;
            }
            .balance-value {
                font-size: 1.5em;
            }
            .lang-toggle {
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="nebula"></div>

    <button class="lang-toggle" onclick="toggleLang()">中文</button>

    <div class="container">
        <div class="header">
            <img src="https://bscscan.com/token/images/bstocks_spacexb_64.png" alt="SPCXB" class="logo">
            <h1>Wrapped SPCXB</h1>
            <div class="subtitle" data-en="Space Portal" data-zh="太空传送门">Space Portal</div>
        </div>

        <button class="connect-btn" id="connectBtn" onclick="connectWallet()">
            <span data-en="Connect Wallet" data-zh="连接钱包">Connect Wallet</span>
        </button>

        <div class="card">
            <div class="balance-section">
                <div class="balance-label" data-en="WSPCXB Balance" data-zh="WSPCXB 余额">WSPCXB Balance</div>
                <div class="balance-value" id="balanceValue">0.0</div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="deposit" onclick="switchTab('deposit')" data-en="Deposit" data-zh="存入">Deposit</button>
                <button class="tab-btn" data-tab="withdraw" onclick="switchTab('withdraw')" data-en="Withdraw" data-zh="取出">Withdraw</button>
            </div>

            <div id="depositTab" class="tab-content">
                <div class="input-group">
                    <label class="input-label" data-en="SPCXB Amount" data-zh="SPCXB 数量">SPCXB Amount</label>
                    <div class="input-wrapper">
                        <input type="number" id="depositAmount" placeholder="0.0" step="any">
                        <button class="max-btn" onclick="setMaxDeposit()" data-en="MAX" data-zh="最大">MAX</button>
                    </div>
                </div>
                <button class="action-btn deposit-btn" id="depositBtn" onclick="deposit()" disabled>
                    <span data-en="Deposit" data-zh="存入">Deposit</span>
                </button>
            </div>

            <div id="withdrawTab" class="tab-content" style="display:none;">
                <div class="input-group">
                    <label class="input-label" data-en="WSPCXB Amount" data-zh="WSPCXB 数量">WSPCXB Amount</label>
                    <div class="input-wrapper">
                        <input type="number" id="withdrawAmount" placeholder="0.0" step="any">
                        <button class="max-btn" onclick="setMaxWithdraw()" data-en="MAX" data-zh="最大">MAX</button>
                    </div>
                </div>
                <button class="action-btn withdraw-btn" id="withdrawBtn" onclick="withdraw()" disabled>
                    <span data-en="Withdraw" data-zh="取出">Withdraw</span>
                </button>
            </div>
        </div>

        <div class="info-card">
            <div class="info-row">
                <span class="info-label" data-en="Contract" data-zh="合约地址">Contract</span>
                <span class="info-value">
                    <a href="https://bscscan.com/address/0x7a66190389B9f626F63Cf2F76339e8706BA460Ca" target="_blank">
                        0x7a66...60Ca
                    </a>
                </span>
            </div>
            <div class="info-row">
                <span class="info-label" data-en="Network" data-zh="网络">Network</span>
                <span class="info-value">BSC (BNB Chain)</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-en="Exchange Rate" data-zh="兑换比例">Exchange Rate</span>
                <span class="info-value">1 SPCXB = 1 WSPCXB</span>
            </div>
            <div class="info-row">
                <span class="info-label" data-en="Tax" data-zh="手续费">Tax</span>
                <span class="info-value" data-en="No Tax" data-zh="无税">No Tax</span>
            </div>
        </div>

        <div class="status" id="statusMsg"></div>

        <div class="footer">
            <div data-en="Governed by" data-zh="治理者">Governed by</div>
            <div class="owner-badge">🐕 Woof</div>
        </div>
    </div>

    <script>
        // i18n
        let currentLang = 'en';
        function toggleLang() {
            currentLang = currentLang === 'en' ? 'zh' : 'en';
            document.querySelector('.lang-toggle').textContent = currentLang === 'en' ? '中文' : 'English';
            document.querySelectorAll('[data-en]').forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });
            document.documentElement.lang = currentLang;
        }

        // Web3
        let userAddress = '';
        let provider = null;
        let signer = null;
        let wspxbContract = null;
        let spcxbContract = null;
        let ethersReady = false;

        const WRAPPED_ADDR = '0x7a66190389B9f626F63Cf2F76339e8706BA460Ca';
        const SPCXB_ADDR = '0xbe9D156892E55e7154BcD3cB0FEA677F9D3103E1';
        const CHAIN_ID = '0x38';
        const BSC_PARAMS = {
            chainId: CHAIN_ID,
            chainName: 'BNB Smart Chain',
            nativeCurrency: { name: 'BNB', symbol: 'BNB', decimals: 18 },
            rpcUrls: ['https://bsc-dataseed.binance.org/'],
            blockExplorerUrls: ['https://bscscan.com/']
        };

        const WRAPPED_ABI = [
            {
                "inputs": [{"internalType": "uint256", "name": "amount", "type": "uint256"}],
                "name": "deposit",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "uint256", "name": "amount", "type": "uint256"}],
                "name": "withdraw",
                "outputs": [],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "address", "name": "account", "type": "address"}],
                "name": "balanceOf",
                "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [],
                "name": "totalSupply",
                "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "address", "name": "spender", "type": "address"}, {"internalType": "uint256", "name": "amount", "type": "uint256"}],
                "name": "approve",
                "outputs": [{"internalType": "bool", "name": "", "type": "bool"}],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "address", "name": "owner", "type": "address"}, {"internalType": "address", "name": "spender", "type": "address"}],
                "name": "allowance",
                "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        const SPCXB_ABI = [
            {
                "inputs": [{"internalType": "address", "name": "owner", "type": "address"}, {"internalType": "address", "name": "spender", "type": "address"}],
                "name": "allowance",
                "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
                "stateMutability": "view",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "address", "name": "spender", "type": "address"}, {"internalType": "uint256", "name": "amount", "type": "uint256"}],
                "name": "approve",
                "outputs": [{"internalType": "bool", "name": "", "type": "bool"}],
                "stateMutability": "nonpayable",
                "type": "function"
            },
            {
                "inputs": [{"internalType": "address", "name": "account", "type": "address"}],
                "name": "balanceOf",
                "outputs": [{"internalType": "uint256", "name": "", "type": "uint256"}],
                "stateMutability": "view",
                "type": "function"
            }
        ];

        async function connectWallet() {
            if (!window.ethereum) {
                showStatus('Please install MetaMask or another Web3 wallet', 'error');
                return;
            }

            if (!ethersReady) {
                showStatus('Loading Web3 library...', 'info');
                return;
            }

            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                
                // Check and switch network
                const chainId = await window.ethereum.request({ method: 'eth_chainId' });
                if (chainId !== CHAIN_ID) {
                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: CHAIN_ID }]
                        });
                    } catch (switchError) {
                        if (switchError.code === 4902) {
                            await window.ethereum.request({
                                method: 'wallet_addEthereumChain',
                                params: [BSC_PARAMS]
                            });
                        } else {
                            throw switchError;
                        }
                    }
                }

                // Create provider and signer properly for ethers.js v5
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                userAddress = await signer.getAddress();

                wspxbContract = new ethers.Contract(WRAPPED_ADDR, WRAPPED_ABI, signer);
                spcxbContract = new ethers.Contract(SPCXB_ADDR, SPCXB_ABI, signer);

                const btn = document.getElementById('connectBtn');
                btn.classList.add('connected');
                btn.innerHTML = `<span>${userAddress.slice(0, 6)}...${userAddress.slice(-4)}</span>`;

                document.getElementById('depositBtn').disabled = false;
                document.getElementById('withdrawBtn').disabled = false;

                await updateBalance();

                showStatus(currentLang === 'en' ? 'Wallet connected successfully' : '钱包连接成功', 'success');
            } catch (err) {
                showStatus(err.message || 'Failed to connect wallet', 'error');
            }
        }

        async function updateBalance() {
            if (!wspxbContract) return;
            try {
                const balance = await wspxbContract.balanceOf(userAddress);
                const formatted = ethers.utils.formatUnits(balance, 18);
                document.getElementById('balanceValue').textContent = parseFloat(formatted).toFixed(4);
            } catch (err) {
                console.error('Balance update failed:', err);
            }
        }

        async function setMaxDeposit() {
            if (!spcxbContract) return;
            try {
                const balance = await spcxbContract.balanceOf(userAddress);
                const formatted = ethers.utils.formatUnits(balance, 18);
                document.getElementById('depositAmount').value = formatted;
            } catch (err) {
                showStatus(currentLang === 'en' ? 'Failed to fetch balance' : '获取余额失败', 'error');
            }
        }

        async function setMaxWithdraw() {
            if (!wspxbContract) return;
            try {
                const balance = await wspxbContract.balanceOf(userAddress);
                const formatted = ethers.utils.formatUnits(balance, 18);
                document.getElementById('withdrawAmount').value = formatted;
            } catch (err) {
                showStatus(currentLang === 'en' ? 'Failed to fetch balance' : '获取余额失败', 'error');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });
            document.getElementById('depositTab').style.display = tab === 'deposit' ? 'block' : 'none';
            document.getElementById('withdrawTab').style.display = tab === 'withdraw' ? 'block' : 'none';
        }

        async function deposit() {
            const amount = document.getElementById('depositAmount').value;
            if (!amount || parseFloat(amount) <= 0) {
                showStatus(currentLang === 'en' ? 'Please enter a valid amount' : '请输入有效数量', 'error');
                return;
            }

            try {
                showStatus(currentLang === 'en' ? 'Approving SPCXB...' : '正在授权 SPCXB...', 'info');
                
                const amountWei = ethers.utils.parseUnits(amount, 18);
                const allowance = await spcxbContract.allowance(userAddress, WRAPPED_ADDR);
                
                if (allowance.lt(amountWei)) {
                    const approveTx = await spcxbContract.approve(WRAPPED_ADDR, amountWei);
                    await approveTx.wait();
                }

                showStatus(currentLang === 'en' ? 'Depositing SPCXB...' : '正在存入 SPCXB...', 'info');
                const depositTx = await wspxbContract.deposit(amountWei);
                await depositTx.wait();

                await updateBalance();
                document.getElementById('depositAmount').value = '';
                showStatus(currentLang === 'en' ? 'Deposit successful!' : '存入成功！', 'success');
            } catch (err) {
                showStatus(err.reason || err.message || 'Transaction failed', 'error');
            }
        }

        async function withdraw() {
            const amount = document.getElementById('withdrawAmount').value;
            if (!amount || parseFloat(amount) <= 0) {
                showStatus(currentLang === 'en' ? 'Please enter a valid amount' : '请输入有效数量', 'error');
                return;
            }

            try {
                showStatus(currentLang === 'en' ? 'Withdrawing WSPCXB...' : '正在取出 WSPCXB...', 'info');
                
                const amountWei = ethers.utils.parseUnits(amount, 18);
                const withdrawTx = await wspxbContract.withdraw(amountWei);
                await withdrawTx.wait();

                await updateBalance();
                document.getElementById('withdrawAmount').value = '';
                showStatus(currentLang === 'en' ? 'Withdrawal successful!' : '取出成功！', 'success');
            } catch (err) {
                showStatus(err.reason || err.message || 'Transaction failed', 'error');
            }
        }

        function showStatus(msg, type) {
            const status = document.getElementById('statusMsg');
            status.textContent = msg;
            status.className = `status show ${type}`;
            setTimeout(() => {
                status.classList.remove('show');
            }, 5000);
        }

        // Initialize ethers.js ready state
        if (typeof ethers !== 'undefined') {
            ethersReady = true;
            console.log('Ethers.js ready');
        }

        // Listen for account changes
        if (window.ethereum) {
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    // Disconnected
                    userAddress = '';
                    wspxbContract = null;
                    spcxbContract = null;
                    const btn = document.getElementById('connectBtn');
                    btn.classList.remove('connected');
                    btn.innerHTML = `<span data-en="Connect Wallet" data-zh="连接钱包">${currentLang === 'en' ? 'Connect Wallet' : '连接钱包'}</span>`;
                    document.getElementById('depositBtn').disabled = true;
                    document.getElementById('withdrawBtn').disabled = true;
                    document.getElementById('balanceValue').textContent = '0.0';
                } else {
                    // Reconnect with new account
                    connectWallet();
                }
            });

            // Listen for chain changes
            window.ethereum.on('chainChanged', () => {
                window.location.reload();
            });
        }
    </script>
</body>
</html>
